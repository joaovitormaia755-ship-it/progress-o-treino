<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Progressão de Treino</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:auto;padding:16px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.title{font-size:24px;font-weight:800}.muted{color:#6b7280;font-size:13px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tab,button{border:1px solid #d1d5db;background:white;color:#111827;border-radius:11px;padding:10px 12px;font:inherit;cursor:pointer}.tab.active,button.primary{background:#2563eb;color:white;border-color:#2563eb}.danger{color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}label{display:block;color:#6b7280;font-size:12px;margin:8px 0 5px}input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:white;font:inherit}.actions{display:flex;flex-wrap:wrap;gap:8px}.exercise{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e5e7eb}.exercise:last-child{border-bottom:0}.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:4px 8px;font-size:12px;white-space:nowrap}.notice{background:#eff6ff;color:#1e40af;border-radius:11px;padding:11px;font-size:13px;line-height:1.4}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:9px 5px;border-bottom:1px solid #e5e7eb;white-space:nowrap}.table th{color:#6b7280;font-weight:500}.empty{text-align:center;color:#6b7280;padding:20px 0;font-size:13px}.stat{font-size:22px;font-weight:800}.setrow{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:7px;align-items:end;margin-bottom:8px}.setnum{color:#6b7280;font-size:13px;padding-bottom:11px;text-align:center}@media(max-width:430px){.grid3{grid-template-columns:1fr 1fr}.app{padding:12px 10px 30px}}
</style></head>
<body><main class="app" id="app"></main>
<script>
(()=>{const KEY='progressao-treino-data-v1';const days=[['push','Push','Peito · Ombros · Tríceps'],['pull','Pull','Costas · Bíceps · Antebraço'],['legs','Legs','Quadríceps · Posterior · Glúteos · Panturrilha'],['upper','Upper','Parte superior completa'],['lower','Lower','Pernas completa']];const defaults={push:['Supino máquina','Supino inclinado máquina','Crucifixo máquina','Elevação lateral','Tríceps francês','Tríceps unilateral na polia'],pull:['Puxada frontal','Remada máquina','Pulldown unilateral','Rosca bíceps na polia','Rosca martelo na polia','Flexão de punho'],legs:['Hack squat','Cadeira extensora','Cadeira flexora','Abdutora','Elevação pélvica','Panturrilha em pé'],upper:['Supino máquina','Puxada frontal','Remada máquina','Elevação lateral','Rosca bíceps na polia','Tríceps francês'],lower:['Hack squat','Cadeira extensora','Cadeira flexora','Elevação pélvica','Abdutora','Panturrilha em pé']};let s={day:'push',selected:null,records:[],custom:{}};try{s={...s,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}let sets=[{reps:'',rir:''},{reps:'',rir:''}];const app=document.querySelector('#app'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);function save(){localStorage.setItem(KEY,JSON.stringify(s))}function names(){return [...defaults[s.day],...(s.custom[s.day]||[])]}function recs(n){return s.records.filter(r=>r.day===s.day&&r.exercise===n)}function last(n){let a=recs(n);return a[a.length-1]}function render(){let d=days.find(x=>x[0]===s.day);app.innerHTML=`<div class="top"><div><div class="title">Progressão de Treino</div><div class="muted">Diário de musculação · salvo neste aparelho</div></div><button id="backup">Backup</button></div><div class="card"><div class="tabs">${days.map(x=>`<button class="tab ${x[0]===s.day?'active':''}" data-day="${x[0]}">${x[1]}</button>`).join('')}</div></div><div class="card"><div class="title">${d[1]}</div><div class="muted">${d[2]}</div><div id="list"></div><div class="actions"><button id="new">+ Exercício</button></div></div><div class="card" id="form" style="display:none"></div><div class="card"><div class="title">Resumo</div><div class="grid3" style="margin-top:10px"><div><div class="muted">Treinos</div><div class="stat">${new Set(s.records.map(r=>r.date)).size}</div></div><div><div class="muted">Exercícios</div><div class="stat">${new Set(s.records.map(r=>r.exercise)).size}</div></div><div><div class="muted">Volume</div><div class="stat">${Math.round(s.records.reduce((a,r)=>a+r.volume,0)).toLocaleString('pt-BR')}</div></div></div></div><div class="card"><div class="title">Histórico</div><div id="history" class="empty">Selecione um exercício.</div></div>`;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{s.day=b.dataset.day;s.selected=null;render()});const list=document.querySelector('#list');list.innerHTML=names().map(n=>{let l=last(n),ready=l&&l.sets.length>=2&&l.sets.every(x=>x.reps>=12);return `<div class="exercise"><div><b>${esc(n)}</b><div class="muted">${l?l.load+' kg · '+l.sets.map(x=>x.reps).join('/'):'Ainda não registrado'}</div></div><div>${ready?'<span class="badge">Subir carga</span> ':''}<button class="reg" data-ex="${esc(n)}">Registrar</button></div></div>`}).join('');document.querySelectorAll('.reg').forEach(b=>b.onclick=()=>open(b.dataset.ex));document.querySelector('#new').onclick=()=>{let n=prompt('Nome do exercício:');if(n&&n.trim()){s.custom[s.day]=s.custom[s.day]||[];if(!names().includes(n.trim()))s.custom[s.day].push(n.trim());save();render();open(n.trim())}};document.querySelector('#backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='backup-progressao-treino.json';a.click()};if(s.selected)open(s.selected)}function open(n){s.selected=n;let f=document.querySelector('#form');f.style.display='block';f.innerHTML=`<div class="title">Registrar: ${esc(n)}</div><div class="grid"><div><label>Data</label><input id="date" type="date" value="${today()}"></div><div><label>Carga (kg)</label><input id="load" type="number" min="0" step="0.5" placeholder="15"></div></div><label>Séries válidas</label><div id="sets"></div><div class="actions"><button id="add">+ Série</button><button class="primary" id="save">Salvar</button><button id="close">Fechar</button></div><div id="notice" class="notice" style="margin-top:10px"></div>`;sets=[{reps:'',rir:''},{reps:'',rir:''}];drawSets();let l=last(n);document.querySelector('#notice').textContent=l?(l.sets.every(x=>x.reps>=12)?'Você bateu 12 reps em todas as séries. Se a execução foi boa, tente subir a carga e voltar para 8–10 reps.':'Tente aumentar as repetições antes de subir a carga.'):'Use uma carga que permita boa execução e deixe cerca de 1–3 reps na reserva.';document.querySelector('#add').onclick=()=>{sets.push({reps:'',rir:''});drawSets()};document.querySelector('#close').onclick=()=>{s.selected=null;f.style.display='none'};document.querySelector('#save').onclick=()=>{let load=Number(document.querySelector('#load').value);let rs=sets.map(x=>({reps:Number(x.reps),rir:x.rir===''?null:Number(x.rir)}));if(!load||rs.some(x=>!x.reps)){alert('Preencha carga e repetições.');return}s.records.push({id:Date.now(),date:document.querySelector('#date').value,day:s.day,exercise:n,load,sets:rs,volume:load*rs.reduce((a,x)=>a+x.reps,0)});save();render();open(n);showHistory(n)};showHistory(n)}function drawSets(){document.querySelector('#sets').innerHTML=sets.map((x,i)=>`<div class="setrow"><div class="setnum">${i+1}</div><input class="rep" data-i="${i}" type="number" min="1" placeholder="Reps"><input class="rir" data-i="${i}" type="number" min="0" max="10" placeholder="RIR"><button class="remove" data-i="${i}">×</button></div>`).join('');document.querySelectorAll('.rep').forEach(x=>x.value=sets[x.dataset.i].reps);document.querySelectorAll('.rir').forEach(x=>x.value=sets[x.dataset.i].rir);document.querySelectorAll('.rep').forEach(x=>x.oninput=()=>sets[x.dataset.i].reps=x.value);document.querySelectorAll('.rir').forEach(x=>x.oninput=()=>sets[x.dataset.i].rir=x.value);document.querySelectorAll('.remove').forEach(x=>x.onclick=()=>{if(sets.length>1){sets.splice(x.dataset.i,1);drawSets()}})}function showHistory(n){let box=document.querySelector('#history');let a=recs(n);if(!a.length){box.textContent='Nenhum registro para este exercício.';return}box.className='tablewrap';box.innerHTML=`<div class="muted" style="margin:8px 0">${esc(n)}</div><table class="table"><tr><th>Data</th><th>Carga</th><th>Séries</th><th>Volume</th></tr>${a.slice().reverse().map(r=>`<tr><td>${r.date.split('-').reverse().join('/')}</td><td>${r.load} kg</td><td>${r.sets.map(x=>x.reps).join('/')}</td><td>${Math.round(r.volume)}</td></tr>`).join('')}</table>`}render()})();
</script></body></html>
