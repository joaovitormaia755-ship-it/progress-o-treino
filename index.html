<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Progressão de Treino</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:22px}h1{margin:0 0 5px}h2{margin-top:0}.sub{color:#667085}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button,.btn{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;background:#e5e7eb}.tabs button.active,.btn.primary{background:#2563eb;color:white}.card{background:white;border:1px solid #e1e5eb;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0000000b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{font-size:13px;font-weight:bold;display:block}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin-top:5px;font:inherit}textarea{min-height:70px}.exercise{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #edf0f3;padding:12px 0}.exercise:last-child{border-bottom:0}.muted{color:#667085;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.danger{background:#fee2e2!important;color:#991b1b}.success{color:#047857;font-weight:bold}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e5e7eb;white-space:nowrap}.small{font-size:12px}.hidden{display:none}@media(max-width:600px){.wrap{padding:12px}.exercise{align-items:flex-start;flex-direction:column}.exercise .actions{margin-top:0}}
</style></head>
<body><main class="wrap">
<h1>Progressão de Treino</h1><div class="sub">Registre cargas, repetições e acompanhe sua evolução.</div>
<div class="tabs" id="tabs"></div><section id="app"></section>
</main>
<script>
const plans={
Push:[['Supino inclinado na máquina','Peito','Peito superior',2,6,10],['Chest press na máquina','Peito','Peito médio',2,6,10],['Crossover na polia','Peito','Adução/contração',2,8,12],['Elevação lateral','Ombros','Deltoide lateral',2,8,12],['Tríceps francês na polia','Tríceps','Cabeça longa/alongamento',2,8,12],['Tríceps Carter unilateral com cotovelo apoiado','Tríceps','Extensão estável',2,8,12]],
Pull:[['Puxada alta na polia','Costas','Largura/dorsais',2,6,10],['Remada na máquina','Costas','Romboides/trapézio médio',2,6,10],['Pullover na máquina ou polia','Costas','Extensão do ombro',2,8,12],['Reverse pec deck','Ombros','Deltoide posterior',2,8,12],['Rosca direta na polia','Bíceps','Flexão do cotovelo',2,8,12],['Rosca martelo na polia','Bíceps/antebraços','Braquial/braquiorradial',2,8,12],['Rosca inversa na polia','Antebraços','Extensores',2,10,15]],
Legs:[['Hack squat','Quadríceps','Quadríceps/glúteos',2,6,10],['Cadeira extensora','Quadríceps','Extensão do joelho',2,8,12],['Cadeira flexora','Posteriores','Flexão do joelho',2,8,12],['Elevação pélvica','Glúteos','Glúteo máximo',2,8,12],['Abdutora','Glúteos','Glúteo médio/mínimo',2,10,15],['Adutora','Adutores','Adutores da coxa',2,10,15],['Panturrilha em pé','Panturrilhas','Gastrocnêmio',2,8,12],['Panturrilha sentado','Panturrilhas','Sóleo',2,10,15]],
Upper:[['Supino inclinado na máquina','Peito','Peito superior',2,6,10],['Chest press na máquina','Peito','Peito médio',2,6,10],['Puxada alta na polia','Costas','Largura/dorsais',2,6,10],['Remada na máquina','Costas','Romboides/trapézio médio',2,8,12],['Elevação lateral','Ombros','Deltoide lateral',2,8,12],['Reverse pec deck','Ombros','Deltoide posterior',2,8,12],['Encolhimento de ombros','Trapézio','Trapézio superior',2,10,15],['Rosca direta na polia','Bíceps','Flexão do cotovelo',2,8,12],['Tríceps francês na polia','Tríceps','Cabeça longa',2,8,12],['Tríceps Carter unilateral com cotovelo apoiado','Tríceps','Extensão estável',2,8,12]],
Lower:[['Leg press 45°','Quadríceps','Quadríceps/glúteos',2,8,12],['Cadeira extensora','Quadríceps','Extensão do joelho',2,8,12],['Cadeira flexora','Posteriores','Flexão do joelho',2,8,12],['Elevação pélvica','Glúteos','Glúteo máximo',2,8,12],['Abdutora','Glúteos','Glúteo médio/mínimo',2,10,15],['Adutora','Adutores','Adutores da coxa',2,10,15],['Panturrilha em pé','Panturrilhas','Gastrocnêmio',2,8,12],['Panturrilha sentado','Panturrilhas','Sóleo',2,10,15],['Abdominal na máquina','Abdômen','Reto abdominal',2,10,15],['Elevação de pernas ou abdominal na polia','Abdômen','Reto abdominal/flexores',2,10,15]]};
let state=JSON.parse(localStorage.getItem('pt_state')||'null')||{active:'Push',custom:{},history:[]};
const save=()=>localStorage.setItem('pt_state',JSON.stringify(state));
const id=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function allExercises(day){return plans[day].map((x,i)=>{let key=id(x[0]);let c=state.custom[key]||{};return {key,name:c.name||x[0],group:c.group||x[1],region:c.region||x[2],sets:c.sets??x[3],min:c.min??x[4],max:c.max??x[5],load:c.load??'',rest:c.rest??90,rir:c.rir??2,fail:c.fail??false,note:c.note||'',order:i+1}})}
function render(){document.querySelector('#tabs').innerHTML=Object.keys(plans).map(d=>`<button class="${state.active===d?'active':''}" onclick="changeDay('${d}')">${d}</button>`).join('');let ex=allExercises(state.active);document.querySelector('#app').innerHTML=`<div class="card"><h2>${state.active}</h2><div class="muted">${ex.length} exercícios cadastrados</div>${ex.map((e,i)=>`<div class="exercise"><div><b>${i+1}. ${e.name}</b><div class="muted">${e.group} • ${e.region} • ${e.sets} séries • ${e.min}–${e.max} reps</div></div><div class="actions"><button class="btn primary" onclick="openLog('${e.key}','${state.active}')">Registrar</button><button class="btn" onclick="editExercise('${e.key}')">Editar</button></div></div>`).join('')}</div><div class="card"><h2>Histórico</h2>${historyHTML()}</div>`}
function changeDay(d){state.active=d;save();render()}
function openLog(key,day){let e=allExercises(day).find(x=>x.key===key);document.querySelector('#app').innerHTML=`<div class="card"><h2>Registrar: ${e.name}</h2><div class="grid"><label>Data<input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Carga (kg)<input id="load" type="number" step="0.5" value="${e.load}"></label><label>Repetições por série<input id="reps" placeholder="Ex.: 10, 9"></label><label>RIR<input id="rir" type="number" value="${e.rir}"></label></div><label style="margin-top:12px">Observações<textarea id="obs">${e.note}</textarea></label><div class="actions"><button class="btn primary" onclick="saveLog('${key}','${day}')">Salvar registro</button><button class="btn" onclick="render()">Cancelar</button></div></div>`}
function saveLog(key,day){let e=allExercises(day);let x=e.find(a=>a.key===key);state.history.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now(),date:date.value,day,exerciseId:key,name:x.name,load:Number(load.value)||0,reps:reps.value,rir:Number(rir.value),obs:obs.value});state.custom[key]={...state.custom[key],load:Number(load.value)||0};save();render()}
function editExercise(key){let e=Object.values(plans).flat().find(x=>id(x[0])===key)||allExercises(state.active).find(x=>x.key===key);let c=state.custom[key]||{};document.querySelector('#app').innerHTML=`<div class="card"><h2>Editar exercício</h2><div class="grid"><label>Nome<input id="en" value="${c.name||e[0]||e.name}"></label><label>Grupo muscular<input id="eg" value="${c.group||e[1]||e.group}"></label><label>Região/função<input id="er" value="${c.region||e[2]||e.region}"></label><label>Séries<input id="es" type="number" value="${c.sets??e[3]??e.sets}"></label><label>Reps mínimas<input id="emin" type="number" value="${c.min??e[4]??e.min}"></label><label>Reps máximas<input id="emax" type="number" value="${c.max??e[5]??e.max}"></label><label>Carga inicial<input id="eload" type="number" step="0.5" value="${c.load??e.load??''}"></label><label>Descanso (segundos)<input id="erest" type="number" value="${c.rest??e.rest??90}"></label><label>RIR padrão<input id="erir" type="number" value="${c.rir??e.rir??2}"></label></div><label style="margin-top:12px">Observações<textarea id="enote">${c.note||e.note||''}</textarea></label><label style="margin-top:12px"><input id="efail" type="checkbox" ${c.fail?'checked':''} style="width:auto"> Pode chegar à falha</label><div class="actions"><button class="btn primary" onclick="saveEdit('${key}')">Salvar alterações</button><button class="btn" onclick="render()">Cancelar</button></div><p class="muted">O histórico anterior não será alterado.</p></div>`}
function saveEdit(key){state.custom[key]={name:en.value,group:eg.value,region:er.value,sets:Number(es.value),min:Number(emin.value),max:Number(emax.value),load:Number(eload.value)||'',rest:Number(erest.value),rir:Number(erir.value),fail:efail.checked,note:enote.value};save();render()}
function historyHTML(){if(!state.history.length)return '<p class="muted">Nenhum registro ainda.</p>';return `<div class="tablewrap"><table><tr><th>Data</th><th>Treino</th><th>Exercício</th><th>Carga</th><th>Reps</th><th>RIR</th><th></th></tr>${state.history.map(h=>`<tr><td>${h.date}</td><td>${h.day}</td><td>${h.name}</td><td>${h.load} kg</td><td>${h.reps}</td><td>${h.rir}</td><td><button class="btn danger small" onclick="removeHistory('${h.id}')">Excluir</button></td></tr>`).join('')}</table></div>`}
function removeHistory(x){state.history=state.history.filter(h=>String(h.id)!==String(x));save();render()}
render();
</script></body></html>
